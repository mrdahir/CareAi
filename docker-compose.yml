version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: care_user
      POSTGRES_PASSWORD: care_secure_password
      POSTGRES_DB: care_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_user -d care_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careapp.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://care_user:care_secure_password@postgres/care_db
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      WESTERN_KENYA_DATA_DIR: /data/western_kenya
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./reversing-the-stall-in-fertility-decline-in-western-kenya-programme-monitoring-data-All-2026-05-19_1703:/data/western_kenya:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
