version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-care_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-care_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-care_user} -d ${POSTGRES_DB:-care_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-care_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-care_db}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://your-frontend.vercel.app"]}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "60"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w 2

volumes:
  postgres_data:
